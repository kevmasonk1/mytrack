    if (s.weight_unit === 'kg') g = parseFloat(($('#gkg').value || '').replace(',', '.')) || null;
    else { const st = parseFloat($('#gst').value) || 0, lb = parseFloat(($('#glb').value || '0').replace(',', '.')) || 0; g = st || lb ? Math.round((st * 14 + lb) * 0.45359237 * 100) / 100 : null; }
    await saveSettings({ name: $('#sn').value.trim(), track_mode: $('#sm').value, daily_points: +$('#sdp').value || 15, weekly_points: +$('#swp').value || 0, kcal_per_point: Math.max(1, +$('#skp').value || 20), carry_over: carry, start_date: $('#ssd').value || null,
      calorie_target: +$('#sct').value || 1600, water_target: +$('#swt').value || 8, week_start: +$('#sws').value, show_macros: macros, goal_weight_kg: g });
    toast('Saved'); drawHeader(); renderSettings();
  };
}
async function saveSettings(patch){ S.settings = await api('/settings', {method:'PUT', body: patch}); }

window.addEventListener('unhandledrejection', e => { const m = e.reason?.message; if (m && m !== 'auth') toast(m); });

/* ---------- change own PIN ---------- */
function openChangePin(){
  openSheet('Change your PIN', `
    <div class="field" style="margin-top:0"><label>Current PIN</label><input id="cp0" type="password" inputmode="numeric" autocomplete="current-password"></div>
    <div class="field"><label>New PIN (4–8 digits)</label><input id="cp1" type="password" inputmode="numeric" autocomplete="new-password"></div>
    <div class="field"><label>New PIN again</label><input id="cp2" type="password" inputmode="numeric" autocomplete="new-password"></div>
    <button class="btn" id="cpSave">Change PIN</button>`);
  $('#cpSave').onclick = async () => {
    const n = $('#cp1').value.trim();
    if (!/^\d{4,8}$/.test(n)) return toast('PIN must be 4–8 digits');
    if (n !== $('#cp2').value.trim()) return toast("New PINs don't match");
    await api('/me/pin', {method:'POST', body:{current: $('#cp0').value.trim(), new: n}});
    toast('PIN changed'); closeSheet();
  };
}

/* ---------- ADMIN ---------- */
const AD = { foodKind: 'custom', q: '' };
function ago(ts){
  if (!ts) return 'never';
  const s = Date.now() / 1000 - ts;
  if (s < 120) return 'just now'; if (s < 3600) return Math.round(s / 60) + ' min ago';
  if (s < 86400) return Math.round(s / 3600) + 'h ago'; if (s < 86400 * 30) return Math.round(s / 86400) + 'd ago';
  return new Date(ts * 1000).toLocaleDateString('en-GB', {day:'numeric', month:'short', year:'numeric'});
}
async function renderAdmin(){
  if (!S.me?.is_admin) return setTab('settings');
  $('#view').innerHTML = '<div class="spin"></div>';
  const d = await api('/admin/overview'), t = d.totals;
  $('#view').innerHTML = `
    <section class="card"><h3>Admin <button class="mini-btn" id="adBack" style="background:var(--sky);color:var(--blue)">‹ Back</button></h3>
      <div class="stat3"><div><b>${t.users}</b><span>People</span></div><div><b>${fmt(t.entries)}</b><span>Diary entries</span></div><div><b>${fmt(t.foods)}</b><span>Foods saved</span></div></div>
    </section>
    <section class="card"><h3>People <button class="mini-btn" id="adAdd">+ Add person</button></h3>
      <div>${d.users.map(u => `<button class="urow" data-u="${u.id}">${avatar(u, 'sm')}
        <span class="n"><b>${esc(u.name)}${u.is_admin ? '<span class="tag">Admin</span>' : ''}${u.active ? '' : '<span class="tag off">Paused</span>'}${u.id === S.me.id ? '<span class="tag">You</span>' : ''}</b>
        <span>${u.last_seen ? "Active " + ago(u.last_seen) : "Not signed in yet"} · ${u.days_30} day${u.days_30 == 1 ? '' : 's'} logged this month</span></span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7A7CA3" stroke-width="2.6" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg></button>`).join('')}</div>
      <p class="hint">Everyone has their own diary, weigh-ins and budget. Foods you scan or create are shared, so the household builds one food list together.</p>
      <p class="hint">If MyTrack is behind Cloudflare Access, add each new person's email to the Access policy too.</p>
    </section>
    <section class="card"><h3>Food database <span class="sub">${t.scanned_foods} scanned · ${t.custom_foods} custom</span></h3>
      <div class="seg" id="adFk" style="box-shadow:none;background:var(--bg)">${[['custom','Custom'],['scanned','Scanned'],['all','All']].map(([k,l]) => `<button data-k="${k}" class="${AD.foodKind===k?'on':''}">${l}</button>`).join('')}</div>
      <div class="search" style="box-shadow:none;border:2px solid var(--line)"><input id="adQ" placeholder="Search foods or barcode" value="${esc(AD.q)}" autocomplete="off"></div>
      <div id="adFoods" style="margin-top:12px"><div class="spin"></div></div>
    </section>
    <section class="card"><h3>Backup</h3>
      <a class="btn sec" href="/api/admin/backup" style="display:block;text-align:center;text-decoration:none;margin-top:0">Download full database</a>
      <p class="hint">A copy of everything — all people, diaries and foods — as a single file. Database size ${fmt(t.db_kb)} KB.</p>
    </section>`;
  $('#adBack').onclick = () => setTab('settings');
  $('#adAdd').onclick = () => openUserSheet(null);
  $('#view').querySelectorAll('[data-u]').forEach(b => b.onclick = () => openUserSheet(d.users.find(u => String(u.id) === b.dataset.u)));
  $('#adFk').onclick = e => { const k = e.target.closest('button')?.dataset.k; if (k) { AD.foodKind = k; $('#adFk').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.k === k)); loadAdminFoods(); } };
  let tq; $('#adQ').oninput = e => { clearTimeout(tq); AD.q = e.target.value; tq = setTimeout(loadAdminFoods, 350); };
  loadAdminFoods();
}
async function loadAdminFoods(){
  const el = $('#adFoods'); if (!el) return;
  const list = await api(`/admin/foods?kind=${AD.foodKind}&q=${encodeURIComponent(AD.q)}`);
  if (!$('#adFoods')) return;
  el.innerHTML = list.length ? list.map((f, i) => `<button class="food" data-i="${i}" style="box-shadow:none;background:var(--bg)">
      ${f.image_url ? `<img src="${esc(f.image_url)}" loading="lazy" alt="">` : `<span class="ph">${f.source === 'custom' ? '⭐' : '🍽️'}</span>`}
      <span class="n"><b>${esc(f.name)}</b><span>${f.brand ? esc(f.brand) + ' · ' : ''}${fmt(f.kcal)} kcal/100g${f.created_by_name ? ' · added by ' + esc(f.created_by_name) : ''}</span></span>
      ${f.zero_points ? '<span class="pill zero">0</span>' : ''}</button>`).join('')
    : `<div class="empty" style="padding:14px">${AD.q ? 'No matches' : AD.foodKind === 'custom' ? 'No custom foods yet' : 'Nothing scanned yet'}</div>`;
  el.querySelectorAll('.food').forEach(b => b.onclick = () => {
    const f = list[+b.dataset.i];
    openCreate(f, () => { closeSheet(); renderAdmin(); }, () => { closeSheet(); renderAdmin(); });
  });
}
function openUserSheet(u){
  const isNew = !u, self = u && u.id === S.me.id;
  openSheet(isNew ? 'Add a person' : u.name, `
    ${isNew ? '' : `<div class="stat3" style="margin-bottom:6px"><div><b>${fmt(u.entries)}</b><span>Entries</span></div><div><b>${u.days_30}</b><span>Days (30d)</span></div><div><b>${u.weigh_ins}</b><span>Weigh-ins</span></div></div>
      <p class="hint" style="margin-top:0">Last logged ${u.last_logged ? parseISO(u.last_logged).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'}) : 'never'} · joined ${ago(u.created)}</p>`}
    <div class="field"><label>Name</label><input id="uN" value="${esc(u?.name || '')}" placeholder="e.g. Sarah" autocomplete="off"></div>
    <div class="field"><label>${isNew ? 'PIN (4–8 digits)' : 'Set a new PIN'}</label><input id="uP" inputmode="numeric" autocomplete="off" placeholder="${isNew ? '' : 'Leave blank to keep their PIN'}"></div>
    ${self ? '' : `<div class="toggle" id="uA">Admin — can manage people &amp; foods<span class="sw ${u?.is_admin ? 'on' : ''}"></span></div>`}
    ${isNew || self ? '' : `<div class="toggle" id="uX">Can sign in<span class="sw ${u.active ? 'on' : ''}"></span></div>`}
    <button class="btn" id="uSave">${isNew ? 'Add person' : 'Save'}</button>
    ${isNew || self ? '' : '<button class="btn danger" id="uDel">Delete person &amp; their diary</button>'}`);
  let admin = !!u?.is_admin, active = u ? !!u.active : true;
  $('#uA') && ($('#uA').onclick = () => { admin = !admin; $('#uA .sw').classList.toggle('on', admin); });
  $('#uX') && ($('#uX').onclick = () => { active = !active; $('#uX .sw').classList.toggle('on', active); });
  $('#uSave').onclick = async () => {
    const name = $('#uN').value.trim(), pin = $('#uP').value.trim();
    if (!name) return toast('Give them a name');
    if ((isNew || pin) && !/^\d{4,8}$/.test(pin)) return toast('PIN must be 4–8 digits');
    if (isNew) await api('/admin/users', {method:'POST', body:{name, pin, is_admin: admin}});
    else {
      const body = { name }; if (pin) body.pin = pin; if (!self) { body.is_admin = admin; body.active = active; }
      await api('/admin/users/' + u.id, {method:'PUT', body});
      if (self) S.settings = await api('/settings');
    }
    toast(isNew ? `${name} added` : 'Saved'); closeSheet(); renderAdmin(); drawHeader();
  };
  $('#uDel') && ($('#uDel').onclick = async () => {
    if (!confirm(`Delete ${u.name}? Their diary, weigh-ins and settings will be permanently removed. Shared foods stay.`)) return;
    await api('/admin/users/' + u.id, {method:'DELETE'}); toast(`${u.name} deleted`); closeSheet(); renderAdmin();
  });
}

/* ---------- boot ---------- */
async function boot(){
  $('#brandDot').innerHTML = LOGO(20);
  try {
    const ar = await fetch('/api/auth', { redirect: 'manual', credentials: 'same-origin' });
    if (ar.type === 'opaqueredirect') { location.reload(); return; }
    const a = await ar.json();
    if (!a.ok) return showLogin(a.users);
    S.me = a.user;
    S.settings = await api('/settings');
    applyTheme(S.settings.theme);
    pushResync();
    const qp = new URLSearchParams(location.search);
    const startTab = qp.get('tab'), startAdd = qp.get('add');
    if (qp.toString()) history.replaceState(null, '', '/');
    setTab(['today','week','progress','settings'].includes(startTab) ? startTab : S.tab);
    if (startAdd === 'scan') openAdd(null, 'scan'); else if (startAdd === 'quick') { openAdd(null, 'search'); openQuick(); }
    const wq = qp.get('withings');
    if (wq) setTimeout(() => toast({ connected: 'Withings connected — weigh-ins imported ⚖️', cancelled: 'Withings connection cancelled', error: "Couldn't connect Withings — please try again" }[wq] || ''), 600);
    withingsAuto();
  } catch (e) { if (e.message !== 'auth') $('#view').innerHTML = `<div class="empty"><div class="e">📡</div><b>${navigator.onLine ? "Can't reach MyTrack right now" : "You're offline"}</b><br>Your diary will load as soon as you're connected again.<br><br><button class="btn sec" onclick="location.reload()" style="width:auto;padding:12px 24px">Try again</button></div>`; }
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.tab === 'today' && S.settings) { if (S._lastToday && S._lastToday !== TODAY() && S.day === S._lastToday) S.day = TODAY(); S._lastToday = TODAY(); loadDay(); } });
S._lastToday = TODAY();
/* ---------- PWA: service worker, updates, install ---------- */
if ('serviceWorker' in navigator) {
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('/sw.js').then(reg => {
    document.addEventListener('visibilitychange', () => { if (!document.hidden) reg.update().catch(() => {}); });
  }).catch(() => {});
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadController || reloaded || $('#sheet').classList.contains('on')) return;
    reloaded = true; location.reload();
  });
}
let installEvt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; if (S.tab === 'settings') drawInstall(); });
window.addEventListener('appinstalled', () => { installEvt = null; toast('MyTrack installed 🎉'); if (S.tab === 'settings') drawInstall(); });
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
function drawInstall(){
  const el = $('#installBody'); if (!el) return;
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (isStandalone()) { $('#installCard').classList.add('hidden'); return; }
  if (installEvt) {
    el.innerHTML = `<p class="hint" style="margin-top:0">Add MyTrack to your home screen so it opens full-screen like a normal app, with a long-press shortcut straight to the scanner.</p><button class="btn" id="instBtn" style="margin-top:12px">Install MyTrack</button>`;
    $('#instBtn').onclick = async () => { installEvt.prompt(); const r = await installEvt.userChoice; installEvt = null; if (r.outcome !== 'accepted') drawInstall(); };
  } else if (ios) {
    el.innerHTML = `<p class="hint" style="margin-top:0">In Safari, tap the <b>Share</b> button <span style="display:inline-block;vertical-align:-3px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2E31B7" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 8l5-5 5 5"/><path d="M5 12v7a2 2 0 002 2h10a2 2 0 002-2v-7"/></svg></span>, then <b>Add to Home Screen</b>. MyTrack will then open full-screen like a normal app.</p>`;
  } else {
    el.innerHTML = `<p class="hint" style="margin-top:0">Open your browser menu (⋮) and choose <b>Install app</b> or <b>Add to Home screen</b>.${window.isSecureContext ? '' : ' Installing and the barcode camera both need the secure <b>https</b> address.'}</p>`;
  }
}
applyTheme(lsGet('mytrack_theme') || 'auto');
boot();
</script>
